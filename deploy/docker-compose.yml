# 运动会管理系统一键部署编排
# 使用方法：
#   cp .env.example .env   # 按需修改密钥
#   docker compose up -d --build
#
# 访问：
#   Web 管理端  http://<服务器IP>/
#   后端 API    http://<服务器IP>:8080/api/...
services:
  mysql:
    image: mysql:8.0
    container_name: sport-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先在 deploy/.env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: sport_db
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行建表脚本（SportBackend/sql/*.sql，均为 CREATE TABLE IF NOT EXISTS）
      - ../SportBackend/sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    healthcheck:
      # 等 sport_db 中 sports_meeting 表建好才算健康，确保后端启动时表已存在
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" sport_db -e 'SELECT 1 FROM sports_meeting LIMIT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: ../SportBackend
      dockerfile: Dockerfile
    container_name: sport-backend
    restart: unless-stopped
    environment:
      # 环境变量覆盖 application.yml 中的硬编码值（Spring Boot relaxed binding）
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/sport_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先在 deploy/.env 中设置 MYSQL_ROOT_PASSWORD}
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build:
      context: ../webManageProject
      dockerfile: Dockerfile
    container_name: sport-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql-data:
